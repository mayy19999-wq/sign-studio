<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מתרגם סימנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone column: signer video stage, live caption, controls. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --stage:#D9E3E6; --ink:#14212A; --muted:#5A6A74;
  --line:#CBD6DA; --accent:#0D7472; --accent-ink:#FFFFFF; --rec:#C93C3C; --ok:#2E7D4F; --warn:#A86A12;
  --skin:#D9A57E; --shirt:#1F2E3A; --hair:#2B1D16;
  --f-display:"Secular One","Arial Hebrew",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161B; --surface:#152028; --stage:#3A5562; --ink:#E4ECEF; --muted:#8EA0A9;
  --line:#26363F; --accent:#3BB3AA; --accent-ink:#06201E; --rec:#E8615E; --ok:#5CC48A; --warn:#E0A54A;
  --skin:#D9A57E; --shirt:#0B1218; --hair:#2B1D16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#152028; --stage:#3A5562; --ink:#E4ECEF; --muted:#8EA0A9;
  --line:#26363F; --accent:#3BB3AA; --accent-ink:#06201E; --rec:#E8615E; --ok:#5CC48A; --warn:#E0A54A;
  --skin:#D9A57E; --shirt:#0B1218; --hair:#2B1D16; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font:400 22px/1.1 var(--f-display);margin:0}
.vocab{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;width:100%;aspect-ratio:4/4.4;max-height:52vh;margin-inline:auto}
.stage canvas{display:block;width:100%;height:100%}
.sv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity .12s;background:var(--stage);pointer-events:none}
.idle{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);text-align:center;padding:16px}
.idle svg{width:64px;height:64px;opacity:.55}
.idle b{font:400 18px var(--f-display);color:var(--ink)}
.sv.on{opacity:1}
@media (prefers-reduced-motion:reduce){.sv{transition:none}}
.badge{z-index:2;position:absolute;top:10px;inset-inline-start:10px;font:600 13px var(--f-body);padding:4px 11px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.badge.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.caption{flex:1;min-height:110px;max-height:30vh;overflow-y:auto;font-size:26px;line-height:1.45;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 10px}
.caption .w{color:var(--muted)}
.caption .w.spelled{color:var(--ink);border-bottom:3px dotted var(--accent)}
.caption .w.known{color:var(--ink);font-weight:600;border-bottom:3px solid var(--accent)}
.caption .w.active{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;border-bottom-color:transparent}
.caption .interim{color:var(--muted);opacity:.6}
.caption .empty{color:var(--muted);font-size:17px}
.mic{width:100%;border:0;border-radius:18px;padding:18px;font:600 20px var(--f-body);background:var(--accent);color:var(--accent-ink);display:flex;gap:12px;align-items:center;justify-content:center;cursor:pointer}
.mic .dot{width:14px;height:14px;border-radius:50%;background:currentColor}
.mic.listening{background:var(--rec);color:#fff}
.mic.listening .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.listening .dot{animation:none}}
.mic:disabled{opacity:.5}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:16px var(--f-body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.type button{font:600 15px var(--f-body);padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools button{font:600 14px var(--f-body);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tools .sep{flex:1}
.tools .mode{padding:8px 12px}
.tools label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);min-height:1.2em}
.note.err{color:var(--rec)}
footer{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header><h1>מתרגם סימנים</h1><span class="vocab" id="vocab">טוען...</span></header>
  <div class="stage">
    <div class="idle" id="idle"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 34V14a4 4 0 0 1 8 0v16M30 28V10a4 4 0 0 1 8 0v18M38 28V14a4 4 0 0 1 8 0v20c0 12-7 22-18 22-7 0-11-4-15-10l-6-10a4 4 0 0 1 7-4l5 6"/></svg><b>מוכן לתרגם</b><span id="idle-sub">מילים עם סרטון יוצגו כאן בשפת סימנים</span></div>
    <video class="sv" id="vIdle" playsinline muted loop preload="auto"></video>
    <video class="sv" id="vA" playsinline muted preload="auto"></video>
    <video class="sv" id="vB" playsinline muted preload="auto"></video>
    <div class="badge" id="badge">מוכן</div>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="tools">
    <button id="replay" type="button">שוב</button>
    <span style="font-size:13px;color:var(--muted)">מהירות</span>
    <button type="button" class="spd" data-s="0.75">איטי</button>
    <button type="button" class="spd" data-s="1" aria-pressed="true">רגיל</button>
    <button type="button" class="spd" data-s="1.25">מהיר</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="spell" checked> איות מילים חסרות</label>
  </div>
  <button class="mic" id="mic"><span class="dot"></span><span id="mic-label">התחילו להקשיב</span></button>
  <div class="note" id="note"></div>
  <form class="type" id="type-form"><input id="type-in" type="text" placeholder="או הקלידו משפט" autocomplete="off"><button type="submit">סימון</button></form>
  <footer><button id="clear" type="button" style="background:none;border:0;color:var(--muted);font:inherit;padding:0;cursor:pointer">ניקוי הכתובית</button><a href="studio.html">צילום סרטונים</a></footer>
</div>
<script>
window.addEventListener("error",function(e){var n=document.getElementById("note");if(n){n.textContent="שגיאה טכנית: "+(e.message||e.error);n.className="note err";}});
window.addEventListener("unhandledrejection",function(e){var n=document.getElementById("note"),r=e.reason;if(n){n.textContent="שגיאה טכנית: "+((r&&r.message)||r);n.className="note err";}});
</script>
<script type="module">
const $=id=>document.getElementById(id);

/* ---------- vocabulary: words that have a real signer video ---------- */
let library=[], idleClip=null;
const strip=s=>s.replace(/[\u0591-\u05C7]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim().toLowerCase();
async function loadVocab(){
  let shared=[];
  try{ const r=await fetch("signs.json?t="+Date.now(),{cache:"no-store"}); if(r.ok) shared=(await r.json()).signs||[]; }catch{}
  const vids=shared.filter(s=>s&&s.name&&s.video);
  idleClip=vids.find(s=>strip(s.name)==="מנוחה")||null;
  library=vids.filter(s=>s!==idleClip);
  $("vocab").textContent=library.length+" סימנים";
  if(idleClip){ const v=$("vIdle"); v.src=idleClip.video; v.play().catch(()=>{}); v.classList.add("on"); }
  if(!library.length) $("idle-sub").textContent="עוד אין סרטונים במאגר. בינתיים תופיע כתובית בלבד.";
}

/* ---------- matching ---------- */
function matchSigns(text){
  const words=strip(text).split(" ").filter(Boolean), map=new Map(library.map(s=>[strip(s.name),s]));
  const maxN=Math.max(1,...library.map(s=>strip(s.name).split(" ").length));
  const out=[]; let i=0;
  while(i<words.length){
    let hit=null;
    for(let n=Math.min(maxN,words.length-i);n>=1;n--){ const k=words.slice(i,i+n).join(" "); if(map.has(k)){hit={sign:map.get(k),n,text:k};break;} }
    if(!hit){ const w=words[i]; if(w.length>2&&"והבלמשכ".includes(w[0])&&map.has(w.slice(1))) hit={sign:map.get(w.slice(1)),n:1,text:w}; }
    if(hit){ out.push({text:hit.text,sign:hit.sign}); i+=hit.n; } else { out.push({text:words[i]}); i++; }
  }
  return out;
}
const FINAL={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
function letterSign(ch){
  const m=new Map(library.filter(s=>/^[\u05D0-\u05EA]$/.test(s.name.trim())).map(s=>[s.name.trim(),s]));
  return m.get(ch)||m.get(FINAL[ch]);
}

/* ---------- caption ---------- */
const caption=$("caption");
let tokens=[], interim="", active=-1, queue=[], lastBatch=[];
function renderCaption(){
  caption.innerHTML="";
  if(!tokens.length&&!interim){ caption.innerHTML='<span class="empty">לחצו על הכפתור ותנו לאדם השומע לדבר אל הטלפון. הכתובית והסימנים יופיעו כאן.</span>'; return; }
  tokens.forEach((t,i)=>{ const s=document.createElement("span"); s.className="w"+(t.sign?" known":"")+(t.spelled?" spelled":"")+(i===active?" active":""); s.textContent=t.text; caption.append(s); });
  if(interim){ const s=document.createElement("span"); s.className="interim"; s.textContent=interim; caption.append(s); }
  caption.scrollTop=caption.scrollHeight;
}
function addText(text){
  const add=matchSigns(text);
  tokens.push(...add);
  if(tokens.length>60){ const cut=tokens.length-60; tokens=tokens.slice(cut); queue.forEach(q=>q.idx-=cut); active-=cut; }
  const start=tokens.length-add.length, batch=[];
  add.forEach((t,i)=>{
    if(t.sign){ batch.push({video:t.sign.video, idx:start+i}); return; }
    // fingerspell unknown words of 3+ letters when every letter has a video
    const w=t.text; if(!$("spell").checked||w.length<3||w.length>9||!/^[\u05D0-\u05EA]+$/.test(w)) return;
    const ls=[...w].map(letterSign); if(ls.some(x=>!x)) return;
    t.spelled=true; ls.forEach(s=>batch.push({video:s.video, idx:start+i, rate:1.35}));
  });
  if(batch.length){ lastBatch=batch; queue.push(...batch); }
  renderCaption(); pump();
}

/* ---------- video playback: two players swap so the next clip is already loaded ---------- */
const vids=[$("vA"),$("vB")], badge=$("badge"); let cur=0, busy=false, hideT=0, speed=1;
function setSrc(v,src){ if(v.dataset.src!==src){ v.dataset.src=src; v.src=src; v.load(); } }
function hideClips(){ vids.forEach(v=>{ v.classList.remove("on"); v.pause(); }); }
function pump(){
  if(busy) return;
  if(!queue.length){ clearTimeout(hideT); hideT=setTimeout(()=>{ if(!busy){ hideClips(); active=-1; renderCaption(); setBadge(); } },700); return; }
  clearTimeout(hideT); busy=true; playClip(queue.shift());
}
function playClip(item){
  const v=vids[cur], other=vids[1-cur];
  active=item.idx; renderCaption(); badge.textContent="מסמן"; badge.classList.add("live");
  setSrc(v,item.video);
  let done=false;
  const finish=()=>{ if(done) return; done=true; v.onended=null; v.onerror=null; clearTimeout(guard); cur=1-cur; busy=false; pump(); };
  const go=()=>{ try{ v.currentTime=0; }catch{} v.playbackRate=speed*(item.rate||1); const p=v.play(); if(p) p.catch(()=>finish()); v.classList.add("on"); other.classList.remove("on"); };
  v.onended=finish; v.onerror=finish;
  const guard=setTimeout(finish,9000);
  if(v.readyState>=2) go(); else v.addEventListener("canplay",go,{once:true});
  if(queue[0]) setSrc(other,queue[0].video);
}
function stopAll(){ queue=[]; vids.forEach(v=>{ v.onended=null; v.pause(); }); busy=false; }

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$("mic"), note=$("note");
let rec=null, wantListen=false;
function setNote(m,err=false){ note.textContent=m; note.classList.toggle("err",err); }
function setBadge(){ badge.textContent=wantListen?"מקשיב":"מוכן"; badge.classList.toggle("live",wantListen); }
if(!SR){ mic.disabled=true; setNote("זיהוי דיבור לא זמין בדפדפן הזה. אפשר להקליד למטה. באייפון: Safari, ובאנדרואיד: Chrome.",true); }
function startRec(){
  // one utterance per session, restarted automatically: iPhone Safari repeats results in continuous mode
  rec=new SR(); rec.lang="he-IL"; rec.interimResults=true; rec.continuous=false;
  rec.onresult=e=>{
    let im="", fin="";
    for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript+" "; else im+=r[0].transcript; }
    if(fin.trim()){ interim=""; addText(fin); } else { interim=im; renderCaption(); }
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ wantListen=false; setNote("אין הרשאה למיקרופון או לזיהוי דיבור. באייפון: הגדרות > Safari > מיקרופון, ובנוסף ודאו שההכתבה מופעלת (הגדרות > כללי > מקלדת).",true); }
    else if(e.error!=="no-speech"&&e.error!=="aborted") setNote("זיהוי הדיבור נעצר ("+e.error+"). ממשיך להקשיב...",true);
  };
  rec.onend=()=>{
    if(interim){ const x=interim; interim=""; addText(x); }
    rec=null;
    if(!wantListen){ updateMic(); return; }
    setTimeout(()=>{ if(!wantListen||rec) return; try{ startRec(); }catch{ stopListen(); setNote("ההקשבה נעצרה. לחצו שוב כדי להמשיך.",true); } },180);
  };
  rec.start();
}
function updateMic(){ mic.classList.toggle("listening",wantListen); $("mic-label").textContent=wantListen?"מקשיב. לחצו לעצירה":"התחילו להקשיב"; if(!busy) setBadge(); }
function stopListen(){ wantListen=false; if(rec) rec.stop(); updateMic(); }
mic.onclick=()=>{
  if(wantListen){ stopListen(); return; }
  wantListen=true; setNote(""); updateMic();
  try{ startRec(); }catch(e){ wantListen=false; updateMic(); setNote("לא הצלחתי להפעיל את המיקרופון.",true); }
};
$("type-form").addEventListener("submit",e=>{ e.preventDefault(); const v=$("type-in").value.trim(); if(v){ addText(v); $("type-in").value=""; } });
document.querySelectorAll(".spd").forEach(b=>b.onclick=()=>{ speed=+b.dataset.s; document.querySelectorAll(".spd").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); });
$("replay").onclick=()=>{ if(!lastBatch.length) return; stopAll(); queue.push(...lastBatch.map(s=>({...s}))); pump(); };
$("clear").onclick=()=>{ stopAll(); hideClips(); tokens=[]; interim=""; active=-1; renderCaption(); setBadge(); };

renderCaption(); updateMic(); loadVocab();
</script>
</body>
</html>
