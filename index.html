<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מתרגם סימנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a studio stage (the avatar) beside a control panel with three tabs — record, library, translate. Stacks on narrow screens. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --stage:#D9E3E6; --ink:#14212A; --muted:#5A6A74;
  --line:#CBD6DA; --accent:#0D7472; --accent-ink:#FFFFFF; --rec:#C93C3C; --ok:#2E7D4F; --warn:#A86A12;
  --skin:#D9A57E; --shirt:#1F2E3A; --hair:#2B1D16;
  --f-display:"Secular One","Arial Hebrew",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161B; --surface:#152028; --stage:#1A2932; --ink:#E4ECEF; --muted:#8EA0A9;
  --line:#26363F; --accent:#3BB3AA; --accent-ink:#06201E; --rec:#E8615E; --ok:#5CC48A; --warn:#E0A54A;
  --skin:#D9A57E; --shirt:#0B1218; --hair:#2B1D16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#152028; --stage:#1A2932; --ink:#E4ECEF; --muted:#8EA0A9;
  --line:#26363F; --accent:#3BB3AA; --accent-ink:#06201E; --rec:#E8615E; --ok:#5CC48A; --warn:#E0A54A;
  --skin:#D9A57E; --shirt:#0B1218; --hair:#2B1D16; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font:400 22px/1.1 var(--f-display);margin:0}
.vocab{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;width:100%;aspect-ratio:4/4.4;max-height:52vh;margin-inline:auto}
.stage canvas{display:block;width:100%;height:100%}
.badge{position:absolute;top:10px;inset-inline-start:10px;font:600 13px var(--f-body);padding:4px 11px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.badge.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.caption{flex:1;min-height:110px;max-height:30vh;overflow-y:auto;font-size:26px;line-height:1.45;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 10px}
.caption .w{color:var(--muted)}
.caption .w.known{color:var(--ink);font-weight:600;border-bottom:3px solid var(--accent)}
.caption .w.active{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;border-bottom-color:transparent}
.caption .interim{color:var(--muted);opacity:.6}
.caption .empty{color:var(--muted);font-size:17px}
.mic{width:100%;border:0;border-radius:18px;padding:18px;font:600 20px var(--f-body);background:var(--accent);color:var(--accent-ink);display:flex;gap:12px;align-items:center;justify-content:center;cursor:pointer}
.mic .dot{width:14px;height:14px;border-radius:50%;background:currentColor}
.mic.listening{background:var(--rec);color:#fff}
.mic.listening .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.listening .dot{animation:none}}
.mic:disabled{opacity:.5}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:16px var(--f-body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.type button{font:600 15px var(--f-body);padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.note{font-size:14px;color:var(--muted);min-height:1.2em}
.note.err{color:var(--rec)}
footer{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header><h1>מתרגם סימנים</h1><span class="vocab" id="vocab">טוען...</span></header>
  <div class="stage"><canvas id="cv" aria-label="אווטאר מסמן"></canvas><div class="badge" id="badge">מוכן</div></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <button class="mic" id="mic"><span class="dot"></span><span id="mic-label">התחילו להקשיב</span></button>
  <div class="note" id="note"></div>
  <form class="type" id="type-form"><input id="type-in" type="text" placeholder="או הקלידו משפט" autocomplete="off"><button type="submit">סימון</button></form>
  <footer><button class="linkish" id="clear" style="background:none;border:0;color:var(--muted);font:inherit;padding:0;cursor:pointer">ניקוי הכתובית</button><a href="studio.html">סטודיו הקלטה</a></footer>
</div>
<script>
window.addEventListener("error",function(e){var n=document.getElementById("note");if(n){n.textContent="שגיאה טכנית: "+(e.message||e.error);n.className="note err";}});
window.addEventListener("unhandledrejection",function(e){var n=document.getElementById("note"),r=e.reason;if(n){n.textContent="שגיאה טכנית: "+((r&&r.message)||r);n.className="note err";}});
</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODELS = {
  pose: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
  hand: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
  face: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
};
const $ = id => document.getElementById(id);
const FACE_KEYS = ["browDownLeft","browDownRight","browInnerUp","browOuterUpLeft","browOuterUpRight","eyeBlinkLeft","eyeBlinkRight","eyeWideLeft","eyeWideRight","jawOpen","mouthSmileLeft","mouthSmileRight","mouthPucker","cheekPuff","mouthFrownLeft","mouthFrownRight"];
const FI = Object.fromEntries(FACE_KEYS.map((k,i)=>[k,i]));
const Z_POSE = 0.35, Z_HAND = 0.9;
const r3 = v => Math.round(v*1000)/1000;

/* ---------- vector helpers ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return mul(a,1/l)};
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpArr=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));

/* ---------- synthetic hand (rest pose + demo) ---------- */
function synthHand(wrist, u, s, curlVec, curl=0.25, size=1){
  u=norm(u); s=norm(s); curlVec=norm(curlVec);
  const pts=new Array(21);
  pts[0]=wrist;
  const fingers=[[5,0.075],[9,0.025],[13,-0.025],[17,-0.07]];
  const segs=[0.1,0.065,0.055];
  for(const [base,off] of fingers){
    let p=add(wrist, add(mul(u,0.21*size), mul(s,off*size*1.25)));
    pts[base]=p; let d=u;
    for(let j=0;j<3;j++){
      d=norm(add(mul(d,Math.cos(curl)), mul(curlVec,Math.sin(curl))));
      p=add(p, mul(d,segs[j]*size*(base===17?0.8:1)));
      pts[base+1+j]=p;
    }
  }
  let p=add(wrist, add(mul(u,0.05*size), mul(s,0.06*size))); pts[1]=p;
  let d=norm(add(u,mul(s,1.1)));
  for(let j=0;j<3;j++){ d=norm(add(mul(d,Math.cos(curl*0.6)), mul(curlVec,Math.sin(curl*0.6)))); p=add(p,mul(d,[0.07,0.06,0.05][j]*size)); pts[2+j]=p; }
  return pts.flat().map(r3);
}
function restFrame(breath=0){
  const b=breath*0.01;
  const p=[[0,0.62,0.25],[0.5,b,0],[-0.5,b,0],[0.6,-0.74+b,0.05],[-0.6,-0.74+b,0.05],[0.56,-1.42+b,0.15],[-0.56,-1.42+b,0.15]];
  return {p:p.flat(), l:synthHand(p[5],[0,-1,0.05],[0,0,1],[-1,0,0],0.35), r:synthHand(p[6],[0,-1,0.05],[0,0,1],[1,0,0],0.35), f:new Array(FACE_KEYS.length).fill(0), h:[0,0,0]};
}
function demoWave(){
  const frames=[];
  for(let i=0;i<54;i++){
    const t=i/30, w=Math.sin(t*Math.PI*2*1.6);
    const ramp=Math.min(1,i/8);
    const rest=restFrame();
    const p=[[0,0.62,0.25],[0.5,0,0],[-0.5,0.03,0],[0.6,-0.74,0.05],[-0.82,-0.5,0.12],[0.56,-1.42,0.15],[-0.78+w*0.1,0.22,0.24]];
    const pr=rest.p; const pf=p.flat().map((v,k)=>r3(lerp(pr[k],v,ramp)));
    const wrist=[pf[18],pf[19],pf[20]];
    const ang=w*0.35, u=[Math.sin(ang),Math.cos(ang),0], s=[-Math.cos(ang),Math.sin(ang),0];
    const f=new Array(FACE_KEYS.length).fill(0); f[FI.mouthSmileLeft]=0.6; f[FI.mouthSmileRight]=0.6; f[FI.browInnerUp]=0.3;
    frames.push({t:Math.round(t*1000), p:pf, l:rest.l, r:synthHand(wrist,u,s,[0,0,1],0.08), f, h:[0,w*0.08,0]});
  }
  return frames;
}

/* ---------- three.js avatar ---------- */
const canvas=$("cv");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,4/5,0.1,50);
camera.position.set(0,-0.12,5.3); camera.lookAt(0,-0.22,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.6));
const key=new THREE.DirectionalLight(0xffffff,1.5); key.position.set(-2,3,4); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.9); fill.position.set(1.5,0.5,5); scene.add(fill);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mats={
  skin:new THREE.MeshStandardMaterial({roughness:0.7}),
  skinDark:new THREE.MeshStandardMaterial({roughness:0.7}),
  shirt:new THREE.MeshStandardMaterial({roughness:0.85}),
  hair:new THREE.MeshStandardMaterial({roughness:0.9}),
  white:new THREE.MeshStandardMaterial({color:0xf4f4f2,roughness:0.4}),
  pupil:new THREE.MeshStandardMaterial({color:0x1b130f,roughness:0.3}),
  mouth:new THREE.MeshStandardMaterial({color:0x6d2b2b,roughness:0.6}),
};
mats.palm=new THREE.MeshStandardMaterial({roughness:0.7,side:THREE.DoubleSide});
function applyTheme(){
  scene.background=new THREE.Color(css("--stage"));
  const skin=new THREE.Color(css("--skin"));
  mats.skin.color=skin; mats.palm.color=skin; mats.skinDark.color=skin.clone().multiplyScalar(0.88);
  mats.shirt.color=new THREE.Color(css("--shirt")); mats.hair.color=new THREE.Color(css("--hair"));
  mats.brow=mats.hair;
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

const UP=new THREE.Vector3(0,1,0);
class Limb{
  constructor(r,mat){this.m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,14),mat);scene.add(this.m);this.v=new THREE.Vector3();}
  set(a,b){
    const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
    this.v.subVectors(B,A); const L=this.v.length()||1e-4;
    this.m.position.addVectors(A,B).multiplyScalar(0.5);
    this.m.scale.set(1,L,1);
    this.m.quaternion.setFromUnitVectors(UP,this.v.normalize());
  }
}
const ball=(r,mat)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);scene.add(m);return m};

// torso, neck
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.5,0.95,8,24),mats.shirt);
torso.scale.set(1.12,1,0.48); torso.position.set(0,-0.88,-0.05); scene.add(torso);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,0.3,16),mats.skin); neck.position.set(0,0.2,0); scene.add(neck);

// head
const head=new THREE.Group(); head.position.set(0,0.62,0); scene.add(head);
const skull=new THREE.Mesh(new THREE.SphereGeometry(0.34,32,24),mats.skin); skull.scale.set(0.92,1.08,0.95); head.add(skull);
const hair=new THREE.Mesh(new THREE.SphereGeometry(0.355,32,20,0,Math.PI*2,0,Math.PI*0.5),mats.hair);
hair.scale.set(0.95,1.1,1); hair.position.set(0,0.035,-0.02); hair.rotation.x=-0.25; head.add(hair);
const nose=new THREE.Mesh(new THREE.SphereGeometry(0.045,14,10),mats.skinDark); nose.position.set(0,-0.03,0.32); head.add(nose);
function makeEye(x){
  const g=new THREE.Group(); g.position.set(x,0.06,0.27);
  const w=new THREE.Mesh(new THREE.SphereGeometry(0.066,16,12),mats.white); w.scale.set(1,0.8,0.55); g.add(w);
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.034,12,10),mats.pupil); p.position.z=0.03; g.add(p);
  head.add(g); return g;
}
const eyeL=makeEye(0.12), eyeR=makeEye(-0.12);
function makeBrow(x){const b=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.038,0.035),mats.hair);b.position.set(x,0.16,0.29);head.add(b);return b}
const browL=makeBrow(0.12), browR=makeBrow(-0.12);
const mouth=new THREE.Mesh(new THREE.SphereGeometry(0.09,20,12),mats.mouth); mouth.position.set(0,-0.16,0.28); head.add(mouth);

// arms
const arm={L:{up:new Limb(0.11,mats.shirt),lo:new Limb(0.095,mats.shirt),sh:ball(0.12,mats.shirt),el:ball(0.1,mats.shirt)},
           R:{up:new Limb(0.11,mats.shirt),lo:new Limb(0.095,mats.shirt),sh:ball(0.12,mats.shirt),el:ball(0.1,mats.shirt)}};
// hands
const HB=[[0,1],[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],[9,10],[10,11],[11,12],[13,14],[14,15],[15,16],[17,18],[18,19],[19,20],[0,5],[5,9],[9,13],[13,17],[0,17]];
function makeHand(){
  const joints=[...Array(21)].map((_,i)=>ball(i===0?0.058:(i%4===0&&i>0?0.03:0.034),mats.skin));
  const bones=HB.map(([a,b])=>new Limb(b===a+1?0.031:0.036,mats.skin));
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(4*9),3));
  const palm=new THREE.Mesh(geo,mats.palm); scene.add(palm);
  return {joints,bones,palm,geo};
}
const hand={L:makeHand(),R:makeHand()};
const HAND_SCALE=1.3;
function setHand(h,pts){
  const w0=[pts[0],pts[1],pts[2]];
  const P=i=>[w0[0]+(pts[i*3]-w0[0])*HAND_SCALE, w0[1]+(pts[i*3+1]-w0[1])*HAND_SCALE, w0[2]+(pts[i*3+2]-w0[2])*HAND_SCALE];
  for(let i=0;i<21;i++){const q=P(i);h.joints[i].position.set(q[0],q[1],q[2]);}
  HB.forEach(([a,b],k)=>h.bones[k].set(P(a),P(b)));
  const tri=[[0,1,5],[0,5,9],[0,9,13],[0,13,17]]; const arr=h.geo.attributes.position.array; let o=0;
  for(const t of tri) for(const i of t){const q=P(i);arr[o++]=q[0];arr[o++]=q[1];arr[o++]=q[2];}
  h.geo.attributes.position.needsUpdate=true; h.geo.computeVertexNormals(); h.geo.computeBoundingSphere();
}
function applyFrame(F){
  const p=i=>[F.p[i*3],F.p[i*3+1],F.p[i*3+2]];
  const sides=[["L",1,3,5,F.l],["R",2,4,6,F.r]];
  for(const [S,si,ei,wi,hp] of sides){
    const a=arm[S], sh=p(si), el=p(ei), wr=hp?[hp[0],hp[1],hp[2]]:p(wi);
    a.sh.position.set(...sh); a.el.position.set(...el); a.up.set(sh,el); a.lo.set(el,wr);
    setHand(hand[S], hp || synthHand(wr, sub(wr,el), [0,0,1], S==="L"?[-1,0,0]:[1,0,0], 0.4));
  }
  const f=F.f||[];
  const g=k=>f[FI[k]]||0;
  eyeL.scale.y=Math.max(0.08,1-g("eyeBlinkLeft")+g("eyeWideLeft")*0.4);
  eyeR.scale.y=Math.max(0.08,1-g("eyeBlinkRight")+g("eyeWideRight")*0.4);
  browL.position.y=0.16+g("browInnerUp")*0.05+g("browOuterUpLeft")*0.04-g("browDownLeft")*0.04;
  browR.position.y=0.16+g("browInnerUp")*0.05+g("browOuterUpRight")*0.04-g("browDownRight")*0.04;
  browL.rotation.z=(g("browInnerUp")-g("browOuterUpLeft"))*0.35-g("browDownLeft")*0.3;
  browR.rotation.z=-(g("browInnerUp")-g("browOuterUpRight"))*0.35+g("browDownRight")*0.3;
  const smile=(g("mouthSmileLeft")+g("mouthSmileRight"))/2, frown=(g("mouthFrownLeft")+g("mouthFrownRight"))/2;
  mouth.scale.set(1+smile*0.45-g("mouthPucker")*0.45, 0.14+g("jawOpen")*1.1+frown*0.05, 0.35);
  mouth.position.y=-0.16-g("jawOpen")*0.04;
  skull.scale.x=0.92+g("cheekPuff")*0.08;
  const h=F.h||[0,0,0];
  head.rotation.set(h[0],h[1],h[2]);
}

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

/* ---------- frame interpolation & playback ---------- */
function lerpFrame(a,b,t){
  return {p:lerpArr(a.p,b.p,t), l:(a.l&&b.l)?lerpArr(a.l,b.l,t):(a.l||b.l), r:(a.r&&b.r)?lerpArr(a.r,b.r,t):(a.r||b.r),
          f:lerpArr(a.f||[],b.f||a.f||[],t), h:lerpArr(a.h||[0,0,0],b.h||[0,0,0],t)};
}
function fillGaps(frames){
  const out=frames.map(f=>({...f, f:f.f||new Array(FACE_KEYS.length).fill(0), h:f.h||[0,0,0]}));
  for(const k of ["l","r"]){
    let last=null; for(const f of out){ if(f[k]) last=f[k]; else if(last) f[k]=last; }
    const first=out.find(f=>f[k]); if(first){ for(const f of out){ if(f[k]) break; f[k]=first[k]; } }
  }
  return out;
}
let player=null; // {frames, marks:[{t,idx}], start, loop, onEnd}
function buildSequence(signs){
  const frames=[], marks=[]; let t=0;
  const rest={...restFrame(), t:0}; frames.push(rest); t=320;
  signs.forEach((s,i)=>{
    const fr=fillGaps(s.frames); const t0=fr[0].t;
    marks.push({t, idx:s.idx??i});
    for(const f of fr) frames.push({...f, t:t+(f.t-t0)});
    t=frames[frames.length-1].t+260;
  });
  frames.push({...restFrame(), t:t+120});
  return {frames, marks};
}
function frameAt(seq, ms){
  const fr=seq.frames; if(ms<=fr[0].t) return fr[0];
  for(let i=1;i<fr.length;i++) if(fr[i].t>=ms){ const a=fr[i-1],b=fr[i]; return lerpFrame(a,b,(ms-a.t)/Math.max(1,b.t-a.t)); }
  return fr[fr.length-1];
}
function play(signs,{loop=false,onMark=null,onEnd=null,label="מסמן"}={}){
  const seq=buildSequence(signs);
  player={...seq,start:performance.now(),loop,onMark,onEnd,lastMark:-1,label};
}
function stopPlay(){ player=null; }


/* ---------- vocabulary: shared signs.json + this device's own recordings ---------- */
let library=[];
async function loadVocab(){
  let shared=[], local=[];
  try{ const r=await fetch("signs.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const d=await r.json(); shared=d.signs||[]; } }catch{}
  try{ local=JSON.parse(localStorage.getItem("signstudio.library.v1")||"[]")||[]; }catch{}
  const ok=s=>s&&s.name&&Array.isArray(s.frames)&&s.frames.length&&!s.example;
  const byName=new Map();
  for(const s of [...shared.filter(ok),...local.filter(ok)]) byName.set(strip(s.name),s); // device recordings override
  library=[...byName.values()];
  $("vocab").textContent=library.length+" סימנים";
}

/* ---------- matching ---------- */
const strip=s=>s.replace(/[֑-ׇ]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim().toLowerCase();
function matchSigns(text){
  const words=strip(text).split(" ").filter(Boolean), map=new Map(library.map(s=>[strip(s.name),s]));
  const maxN=Math.max(1,...library.map(s=>strip(s.name).split(" ").length));
  const out=[]; let i=0;
  while(i<words.length){
    let hit=null;
    for(let n=Math.min(maxN,words.length-i);n>=1;n--){ const k=words.slice(i,i+n).join(" "); if(map.has(k)){hit={sign:map.get(k),n,text:k};break;} }
    if(!hit){ const w=words[i]; if(w.length>2&&"והבלמשכ".includes(w[0])&&map.has(w.slice(1))) hit={sign:map.get(w.slice(1)),n:1,text:w}; }
    if(hit){ out.push({text:hit.text,sign:hit.sign}); i+=hit.n; } else { out.push({text:words[i]}); i++; }
  }
  return out;
}

/* ---------- caption + sign queue ---------- */
const caption=$("caption");
let tokens=[], interim="", active=-1, queue=[];
function renderCaption(){
  caption.innerHTML="";
  if(!tokens.length&&!interim){ caption.innerHTML='<span class="empty">לחצו על הכפתור ותנו לאדם השומע לדבר אל הטלפון. התרגום יופיע כאן ועל האווטאר.</span>'; return; }
  tokens.forEach((t,i)=>{ const s=document.createElement("span"); s.className="w"+(t.sign?" known":"")+(i===active?" active":""); s.textContent=t.text; caption.append(s); });
  if(interim){ const s=document.createElement("span"); s.className="interim"; s.textContent=interim; caption.append(s); }
  caption.scrollTop=caption.scrollHeight;
}
function addText(text){
  const add=matchSigns(text);
  tokens.push(...add);
  if(tokens.length>60){ const cut=tokens.length-60; tokens=tokens.slice(cut); queue.forEach(q=>q.idx-=cut); active-=cut; }
  const start=tokens.length-add.length; add.forEach((t,i)=>{ if(t.sign) queue.push({frames:t.sign.frames, idx:start+i}); });
  renderCaption(); pump();
}
function pump(){
  if(player||!queue.length) return;
  const batch=queue.splice(0);
  play(batch,{label:"מסמן",onMark:i=>{active=i;renderCaption();},onEnd:()=>{active=-1;renderCaption();pump();}});
}

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$("mic"), note=$("note"), badge=$("badge");
let rec=null, wantListen=false;
function setNote(m,err=false){ note.textContent=m; note.classList.toggle("err",err); }
if(!SR){ mic.disabled=true; setNote("זיהוי דיבור לא זמין בדפדפן הזה. אפשר להקליד למטה. באייפון: Safari, ובאנדרואיד: Chrome.",true); }
function startRec(){
  rec=new SR(); rec.lang="he-IL"; rec.interimResults=true; rec.continuous=true;
  rec.onresult=e=>{
    let im="";
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) addText(r[0].transcript); else im+=r[0].transcript; }
    interim=im; renderCaption();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ wantListen=false; setNote("אין הרשאה למיקרופון או לזיהוי דיבור. באייפון: הגדרות > Safari > מיקרופון, ובנוסף ודאו שהכתבה (Dictation) מופעלת.",true); }
    else if(e.error!=="no-speech"&&e.error!=="aborted") setNote("זיהוי הדיבור נעצר ("+e.error+"). ממשיך להקשיב...",true);
  };
  rec.onend=()=>{ if(interim){ addText(interim); interim=""; } rec=null; if(wantListen){ try{ startRec(); }catch{ stopListen(); } } else updateMic(); };
  rec.start();
}
function updateMic(){
  mic.classList.toggle("listening",wantListen);
  $("mic-label").textContent=wantListen?"מקשיב. לחצו לעצירה":"התחילו להקשיב";
  badge.textContent=wantListen?"מקשיב":"מוכן"; badge.classList.toggle("live",wantListen);
}
function stopListen(){ wantListen=false; if(rec) rec.stop(); updateMic(); }
mic.onclick=()=>{
  if(wantListen){ stopListen(); return; }
  wantListen=true; setNote(""); updateMic();
  try{ startRec(); }catch(e){ wantListen=false; updateMic(); setNote("לא הצלחתי להפעיל את המיקרופון.",true); }
};
$("type-form").addEventListener("submit",e=>{ e.preventDefault(); const v=$("type-in").value.trim(); if(v){ addText(v); $("type-in").value=""; } });
$("clear").onclick=()=>{ tokens=[]; queue=[]; interim=""; active=-1; stopPlay(); renderCaption(); };

/* ---------- main loop ---------- */
function loop(now){
  if(player){
    let ms=now-player.start; const end=player.frames.at(-1).t;
    if(ms>end){ const cb=player.onEnd; player=null; applyFrame(restFrame()); if(cb) cb(); }
    else{ applyFrame(frameAt(player,ms)); if(player.onMark){ let m=-1; for(const k of player.marks) if(ms>=k.t) m=k.idx; if(m!==player.lastMark){ player.lastMark=m; player.onMark(m); } } }
  } else applyFrame(restFrame(Math.sin(now/900)));
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
renderCaption(); updateMic(); loadVocab();
requestAnimationFrame(loop);
</script>
